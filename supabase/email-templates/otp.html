<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouthTempo 登录验证码</title>
  </head>
  <body style="margin:0;background:#f4f7f3;color:#20312d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f7f3;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <div style="font-size:24px;font-weight:800;color:#20312d;">YouthTempo</div>
              </td>
            </tr>
            <tr>
              <td style="background:#ffffff;border:1px solid #dfe7e2;border-radius:16px;padding:36px 32px;text-align:center;">
                <h1 style="margin:0;font-size:28px;line-height:1.35;font-weight:800;color:#20312d;">登录 YouthTempo</h1>
                <p style="margin:14px 0 0;font-size:16px;line-height:1.8;color:#65736f;">请在登录页面输入以下验证码</p>

                <div style="margin:30px 0;padding:24px 16px;border:1px solid #dfe7e2;border-radius:12px;background:#fbfcfb;">
                  <div style="font-size:34px;line-height:1.2;font-weight:800;letter-spacing:8px;color:#277d66;">{{ .Token }}</div>
                </div>

                <p style="margin:0;font-size:15px;line-height:1.8;color:#475652;">验证码将在 1 小时后失效，且仅可使用一次。</p>
                <p style="margin:12px 0 0;font-size:15px;line-height:1.8;font-weight:700;color:#20312d;">请勿向任何人透露验证码。YouthTempo 不会通过电话、微信或邮件向你索要验证码。</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 18px 0;">
                <p style="margin:0;font-size:13px;line-height:1.8;color:#7a8783;">你收到这封邮件，是因为有人使用此邮箱请求登录 YouthTempo。</p>
                <p style="margin:4px 0 0;font-size:13px;line-height:1.8;color:#7a8783;">如果不是你本人操作，可以忽略此邮件。</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
