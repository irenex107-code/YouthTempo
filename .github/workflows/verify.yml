name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Build production app
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public-flow and safety tests
        run: pnpm test:e2e

      - name: Run authenticated permission-boundary tests when configured
        env:
          E2E_PERMISSION_TEST_PASSWORD: ${{ secrets.E2E_PERMISSION_TEST_PASSWORD }}
          PLAYWRIGHT_BASE_URL: https://youthtempo-web-287026-8-1457638967.sh.run.tcloudbase.com
        run: |
          if [ -z "$E2E_PERMISSION_TEST_PASSWORD" ]; then
            echo "Authenticated permission tests are waiting for the virtual test password."
            exit 0
          fi
          pnpm exec playwright test tests/authenticated-permission-boundary.spec.ts
