name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Build production app
        run: pnpm build

      - name: Install Playwright mobile browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run public-flow and safety tests
        run: pnpm test:e2e

      - name: Run mobile Chrome, Safari, and WeChat WebView checks
        run: pnpm test:e2e:mobile-browsers

      - name: Run authenticated permission, revocation, and community tests when configured
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PERMISSION_TEST_PASSWORD: ${{ secrets.E2E_PERMISSION_TEST_PASSWORD }}
        run: |
          if [ -z "$E2E_SUPABASE_URL" ] || [ -z "$E2E_SUPABASE_ANON_KEY" ] || [ -z "$E2E_SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$E2E_PERMISSION_TEST_PASSWORD" ]; then
            echo "::warning::Authenticated workflow tests are skipped until the isolated E2E Supabase secrets are configured."
            exit 0
          fi

          export NEXT_PUBLIC_SUPABASE_URL="$E2E_SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$E2E_SUPABASE_ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$E2E_SUPABASE_SERVICE_ROLE_KEY"
          export ALLOW_E2E_FIXTURE_MUTATION=true

          cleanup_fixtures() {
            pnpm test:fixtures:permissions:cleanup
          }
          trap cleanup_fixtures EXIT INT TERM

          pnpm test:fixtures:permissions
          pnpm exec playwright test --workers=1 \
            tests/authenticated-permission-boundary.spec.ts \
            tests/authenticated-api-overreach.spec.ts \
            tests/membership-revocation.spec.ts \
            tests/account-data-lifecycle.spec.ts \
            tests/pilot-feedback-lifecycle.spec.ts \
            tests/school-exit.spec.ts \
            tests/community-visibility.spec.ts \
            tests/community-moderation.spec.ts
