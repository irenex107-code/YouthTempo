name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Build production app
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public-flow and safety tests
        run: pnpm test:e2e

      - name: Run authenticated permission, revocation, and community tests when configured
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://saqkzfsmabsgbwdvuras.supabase.co
          E2E_PERMISSION_TEST_PASSWORD: ${{ secrets.E2E_PERMISSION_TEST_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$E2E_PERMISSION_TEST_PASSWORD" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Authenticated workflow tests require both E2E_PERMISSION_TEST_PASSWORD and SUPABASE_SERVICE_ROLE_KEY." >&2
            exit 1
          fi
          pnpm test:fixtures:permissions
          pnpm exec playwright test \
            tests/authenticated-permission-boundary.spec.ts \
            tests/authenticated-api-overreach.spec.ts \
            tests/membership-revocation.spec.ts \
            tests/school-exit.spec.ts \
            tests/community-visibility.spec.ts \
            tests/community-moderation.spec.ts
